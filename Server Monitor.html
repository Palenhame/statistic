<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Server Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#030304;--p:#0a0a0c;--l:#1b1416;--r:#c8142e;--r2:#5e0a17;--t:#e3d9dc;--m:#85767b;--g:#2bb883;--y:#d9962a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t);font:15px/1.5 Onest,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(500px circle at var(--mx,70%) var(--my,10%),#c8142e12,transparent 70%),linear-gradient(#ffffff06 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,#ffffff06 1px,transparent 1px) 0 0/44px 44px;pointer-events:none;mask:radial-gradient(900px at var(--mx,70%) var(--my,10%),#000,transparent);-webkit-mask:radial-gradient(900px at var(--mx,70%) var(--my,10%),#000,transparent)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--r2),var(--r));box-shadow:0 0 14px var(--r);z-index:50}
nav{position:fixed;left:0;top:0;bottom:0;width:230px;padding:28px 18px;border-right:1px solid var(--l);background:#050507ee;backdrop-filter:blur(10px);z-index:20;display:flex;flex-direction:column;gap:4px}
.logo{font:700 15px Unbounded,sans-serif;display:flex;gap:10px;align-items:center;margin-bottom:26px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--r);box-shadow:0 0 0 0 #ff1f3d99;animation:pu 1.8s infinite}
@keyframes pu{70%{box-shadow:0 0 0 12px #ff1f3d00}100%{box-shadow:0 0 0 0 #ff1f3d00}}
nav a{color:var(--m);text-decoration:none;padding:11px 14px;border-radius:10px;position:relative;transition:.3s}
nav a:hover{color:var(--t);transform:translateX(4px)}
nav a.on{color:#fff;background:linear-gradient(90deg,#ff1f3d2e,transparent)}
nav a.on::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--r);box-shadow:0 0 12px var(--r)}
main{margin-left:230px;padding:56px clamp(18px,4vw,64px) 90px;max-width:1400px}
h1{font:700 clamp(1.8rem,4.4vw,3.4rem)/1.1 Unbounded,sans-serif;letter-spacing:-.02em;margin-bottom:8px}
h1 span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(-70deg);animation:ch .8s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes ch{to{opacity:1;transform:none}}
h2{font:400 13px Unbounded,sans-serif;color:var(--m);margin:0 0 14px}
.sub{color:var(--m);margin-bottom:34px;max-width:60ch}
.hero{position:relative;padding:40px 0 30px;margin-bottom:30px}
.hero h1{font-size:clamp(2.8rem,9vw,7.5rem);line-height:.95}
.hero h1 span:nth-child(n+1){text-shadow:0 0 36px #c8142e2a}
.ecg{width:100%;height:110px;margin-top:20px}
.ecg path{fill:none;stroke:var(--r);stroke-width:2;filter:drop-shadow(0 0 3px var(--r));stroke-dasharray:1000;animation:ec 3.2s linear infinite}
@keyframes ec{from{stroke-dashoffset:1000}to{stroke-dashoffset:-1000}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:linear-gradient(160deg,#120d10,var(--p));border:1px solid var(--l);border-radius:var(--rad,18px);padding:22px;position:relative;overflow:hidden;transition:.4s}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--cx,50%) var(--cy,0),#ff1f3d1c,transparent);opacity:0;transition:.4s;pointer-events:none}
.card:hover{border-color:#ff1f3d66;transform:translateY(-3px)}.card:hover::after{opacity:1}
.k{font:700 clamp(1.8rem,3vw,2.5rem) Unbounded,sans-serif;margin:6px 0}.k small{font-size:.45em;color:var(--m);margin-left:4px}
.lb{color:var(--m);font-size:13px}
.bar{height:6px;background:#ffffff0d;border-radius:6px;overflow:hidden;margin-top:10px}
.bar b{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--r2),var(--r));transition:width 1.2s cubic-bezier(.2,.9,.2,1)}
.bar b.y{background:var(--y)}.bar b.g{background:var(--g)}
canvas{width:100%;height:240px;display:block}
.rv{opacity:0;transform:translateY(50px) scale(.97);filter:blur(6px);transition:all .9s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i,0)*70ms)}
.rv.in{opacity:1;transform:none;filter:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--m);font-weight:500;font-size:12px;padding:8px 10px;cursor:pointer;white-space:nowrap}th:hover{color:var(--r)}
td{padding:10px;border-top:1px solid var(--l);font-size:14px;white-space:nowrap}
tbody tr{transition:.25s}tbody tr:hover{background:#ff1f3d12}
.sc{overflow-x:auto}
.rng{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.rng button,.chip{background:transparent;border:1px solid var(--l);color:var(--m);padding:8px 16px;border-radius:30px;cursor:pointer;font:inherit;transition:.3s}
.rng button:hover,.chip:hover{border-color:var(--r);color:var(--t)}
.rng button.on,.chip.on{background:var(--r);border-color:var(--r);color:#fff;box-shadow:0 0 10px #c8142e44}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--m);vertical-align:middle}
.dot.run{background:var(--g);animation:pg 1.6s infinite}.dot.bad{background:var(--r);animation:pr 1s infinite}.dot.warn{background:var(--y)}
@keyframes pg{50%{box-shadow:0 0 0 7px #2ee59d00;} 0%{box-shadow:0 0 0 0 #2ee59d99}}
@keyframes pr{50%{box-shadow:0 0 0 8px #ff1f3d00} 0%{box-shadow:0 0 0 0 #ff1f3daa}}
.mini{display:inline-block;width:60px;height:5px;background:#ffffff12;border-radius:5px;vertical-align:middle;margin-right:8px;overflow:hidden}.mini b{display:block;height:100%;background:var(--r)}
.alert{border:1px solid var(--r);background:linear-gradient(90deg,#ff1f3d30,#ff1f3d08);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;animation:al 2s infinite}
@keyframes al{50%{box-shadow:0 0 30px #ff1f3d44}}
.btn{background:var(--r);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:600 14px Onest;cursor:pointer;transition:.3s;display:inline-flex;gap:8px;align-items:center}
.btn:hover{box-shadow:0 0 12px #c8142e66;transform:translateY(-1px)}.btn.o{background:transparent;border:1px solid var(--l);color:var(--t)}.btn.o:hover{border-color:var(--r)}
.btn[disabled]{opacity:.6;pointer-events:none}
.sp{width:14px;height:14px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
input{background:#0b0b0e;border:1px solid var(--l);color:var(--t);padding:10px 16px;border-radius:30px;font:inherit;min-width:min(100%,280px);outline:0;transition:.3s}input:focus{border-color:var(--r);box-shadow:0 0 18px #ff1f3d44}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.acc{margin-bottom:14px}.acc>.hd{display:flex;gap:14px;align-items:center;padding:14px 18px;cursor:pointer;border:1px solid var(--l);border-radius:14px;background:var(--p);transition:.3s}
.acc>.hd:hover{border-color:var(--r)}.badge{background:#ff1f3d22;color:var(--r);border-radius:20px;padding:2px 12px;font-size:12px}
.acc>.bd{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s}.acc.c>.bd{grid-template-rows:0fr}.bd>div{overflow:hidden}
#ins{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#08080a;border-left:1px solid var(--r);transform:translateX(105%);transition:transform .6s cubic-bezier(.2,.9,.2,1);z-index:40;padding:26px;overflow-y:auto;box-shadow:-30px 0 80px #000}
#ins.o{transform:none}
.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}
.term{background:#000;border:1px solid var(--l);border-radius:12px;padding:14px;height:300px;overflow:auto;font:12px/1.6 ui-monospace,Consolas,monospace;color:#d8a0a8}
.term div{animation:ch .4s}.term .e{color:var(--r)}
pre{background:#000;border:1px solid var(--l);border-radius:10px;padding:10px 14px;font:12px ui-monospace,monospace;display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:#e9b3ba;overflow-x:auto}
#md{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:none;place-items:center;z-index:60}#md.o{display:grid}
#md div{background:var(--p);border:1px solid var(--r);border-radius:18px;padding:28px;max-width:380px;animation:ch .4s forwards;box-shadow:0 0 60px #ff1f3d44}
#ts{position:fixed;right:22px;bottom:22px;display:grid;gap:8px;z-index:70}
.toast{background:var(--p);border-left:4px solid var(--g);padding:14px 20px;border-radius:10px;animation:ti .5s;box-shadow:0 10px 40px #000}.toast.e{border-color:var(--r)}
@keyframes ti{from{transform:translateX(120%)}}
.ring{width:84px;height:84px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
@media(max-width:820px){nav{top:auto;width:100%;height:62px;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--l);overflow-x:auto;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}.logo{display:none}nav a{white-space:nowrap;padding:10px 12px}main{margin-left:0;padding-top:34px}}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}.heat i{aspect-ratio:1;border-radius:3px;background:var(--r);opacity:calc(var(--v)*.85 + .06);transition:.3s}.heat i:hover{transform:scale(1.6);opacity:1;position:relative;z-index:2}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tile{width:54px;height:54px;border-radius:12px;border:1px solid var(--l);display:grid;place-items:center;font-size:11px;cursor:pointer;background:var(--p);color:var(--m);transition:.3s}.tile:hover{transform:translateY(-4px) rotate(-3deg);border-color:var(--r);color:var(--t)}.tile.run{border-color:#2bb88355}.tile.bad{border-color:var(--r);animation:al 2s infinite}.tile.warn{border-color:#d9962a88}
.feed div{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--l);animation:ch .6s both}.feed time{color:var(--m);font-size:12px;min-width:56px}.gauge{width:100%;max-width:280px;display:block;margin:0 auto}
.fold>.sb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s cubic-bezier(.2,.9,.2,1)}.fold.c>.sb{grid-template-rows:0fr}.sb>div{overflow:hidden;min-height:0}
.fh{cursor:pointer;display:flex;justify-content:space-between;transition:.3s}.fh:hover{color:var(--t)}.fh::after{content:"\2212";color:var(--r);font-size:18px;line-height:1}.fold.c .fh::after{content:"+"}.fold.c .fh{margin-bottom:0}.fold.c{padding-top:18px;padding-bottom:18px}.g2{align-items:start}
.th{margin-top:auto;display:grid;gap:4px}.th button{background:none;border:1px solid var(--l);color:var(--m);padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;text-align:left;transition:.3s}.th button:hover{color:var(--t);border-color:var(--r)}.th button.on{color:#fff;background:var(--r);border-color:var(--r)}
html[data-th=ctrl]{--r:#a3182b;--r2:#4d0a14;--rad:6px}html[data-th=ctrl] body::before{background:linear-gradient(#ffffff05 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,#ffffff05 1px,transparent 1px) 0 0/44px 44px;mask:none;-webkit-mask:none}html[data-th=ctrl] .card{background:#0a0a0c;border-color:#1d1d22}html[data-th=ctrl] .card::after{display:none}
html[data-th=cyber]{--r:#b8133f;--r2:#4a0a2a;--rad:3px;--m:#8a7684}html[data-th=cyber] body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#00000066 2px 3px);z-index:90;opacity:.45}html[data-th=cyber] h1,html[data-th=cyber] h2{letter-spacing:.05em}html[data-th=cyber] .card{border-left:3px solid var(--r);background:linear-gradient(120deg,#17080f,#09090c)}
html[data-th=min]{--r:#9a1c2e;--rad:0px}html[data-th=min] body::before{display:none}html[data-th=min] .card{background:none;border:0;border-top:1px solid var(--l);padding:22px 0}html[data-th=min] .card::after{display:none}html[data-th=min] .card:hover{transform:none;border-top-color:var(--r)}html[data-th=min] nav{background:var(--bg)}
html[data-th=prem]{--r:#8f1527;--rad:24px}html[data-th=prem] .card{background:linear-gradient(165deg,#18121a,#0b0a0d);box-shadow:inset 0 1px 0 #ffffff14,0 24px 60px #000a;border-color:#ffffff0f}
@media(max-width:820px){.th{display:flex;margin:0 0 0 auto}.th .lb{display:none}.th button{white-space:nowrap}}
.th{display:none!important}.nd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:10px;vertical-align:middle}
.card[style*="--a"]::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:3px;background:var(--a)}.card[style*="--a"] .k span{color:var(--a)}.card[style*="--a"] .bar b{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 40%,#000),var(--a))}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="bar"></div>
<nav id="nv"><div class="logo"><i></i>Server Monitor</div></nav>
<main id="m"></main><aside id="ins"></aside><div id="md"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
let IV=+LS('iv')||2000,timer;
const R=(a,b)=>a+Math.random()*(b-a);
const walk=(n,b,a,mx=99)=>{let v=b,o=[];for(let i=0;i<n;i++){v+=(Math.random()-.5)*a+(b-v)*.1;o.push(Math.max(1,Math.min(mx,v)))}return o};
const NAV=[['/','Обзор'],['/cpu','Процессор'],['/memory','Память и Swap'],['/network','Сеть'],['/disks','Диски'],['/docker','Docker'],['/settings','Настройки']];
$('#nv').innerHTML+=NAV.map(([p,l],i)=>`<a href="#${p}" data-p="${p}"><i class="nd" style="background:${['#d04058','#e0603a','#d9962a','#3aa0d8','#2bb883','#8b6fd6','#85767b'][i]}"></i>${l}</a>`).join('');
const TH=[['ctrl','Пульт'],['cyber','Киберпанк'],['min','Минимал'],['prem','Премиум']];
function setTh(t){document.documentElement.dataset.th=t;LS('th',t);$$('.th button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));window.__r&&route()}
$('#nv').insertAdjacentHTML('beforeend',`<div class="th"><div class="lb">Стиль</div>${TH.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('')}</div>`);
$$('.th button').forEach(b=>b.onclick=()=>setTh(b.dataset.t));setTh('ctrl');
function fold(){if(location.hash=='#/settings')return;$$('#m .card').forEach(c=>{const h=c.firstElementChild;if(!h||h.tagName!='H2'||c.querySelector('.gauge')||c.closest('.acc'))return;const b=document.createElement('div'),w=document.createElement('div');b.className='sb';while(h.nextSibling)w.append(h.nextSibling);b.append(w);c.append(b);c.classList.add('fold');if(c.querySelector('.heat'))c.classList.add('c');h.classList.add('fh');h.onclick=()=>c.classList.toggle('c')})}
const split=t=>[...t].map((c,i)=>`<span style="animation-delay:${i*45}ms">${c==' '?'&nbsp;':c}</span>`).join('');
const head=(t,s)=>`<h1>${split(t)}</h1><p class="sub rv">${s}</p>`;
const AC={cpu:'#d04058',ram:'#d9962a',rx:'#3aa0d8',tx:'#8b6fd6',m1:'#d9962a',m2:'#8b6fd6'};const cap=(l,id,b,u,a=6)=>`<div class="card rv" style="--a:${AC[id]}"><div class="lb">${l}</div><div class="k"><span data-live="${id}" data-b="${b}" data-a="${a}">0</span><small>${u}</small></div><div class="bar"><b data-w="${b}"></b></div></div>`;

function chart(cv,ss,cols,names,fmt=v=>v.toFixed(0)+'%'){const rr=getComputedStyle(document.documentElement).getPropertyValue('--r').trim()||'#a3182b';cols=cols.map(x=>({'#ff1f3d':rr,'#ff5a70':rr}[x]||x));
 const c=cv.getContext('2d'),d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*d;cv.height=H*d;c.scale(d,d);
 const mx=Math.max(...ss.flat())*1.15,t0=performance.now();let hx=-1;
 const draw=now=>{const p=Math.min(1,(now-t0)/1100),e=1-Math.pow(1-p,3);c.clearRect(0,0,W,H);
  c.strokeStyle='#ffffff10';for(let i=1;i<5;i++){c.beginPath();c.moveTo(0,H*i/5);c.lineTo(W,H*i/5);c.stroke()}
  ss.forEach((s,k)=>{const n=s.length;c.beginPath();s.forEach((v,i)=>{const x=i/(n-1)*W,y=H-v/mx*H*e;i?c.lineTo(x,y):c.moveTo(x,y)});
   c.strokeStyle=cols[k];c.lineWidth=2;c.shadowColor=cols[k];c.shadowBlur=4;c.stroke();c.shadowBlur=0;
   c.lineTo(W,H);c.lineTo(0,H);const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,cols[k]+'30');g.addColorStop(1,cols[k]+'00');c.fillStyle=g;c.fill()});
  if(hx>=0){const i=Math.round(hx/W*(ss[0].length-1));c.strokeStyle='#ffffff55';c.beginPath();c.moveTo(hx,0);c.lineTo(hx,H);c.stroke();
   c.font='12px Onest';ss.forEach((s,k)=>{c.fillStyle=cols[k];const tx=hx>W-150?hx-150:hx+10;c.fillText((names[k]||'')+' '+fmt(s[i]),tx,20+k*18)})}
  if(p<1)requestAnimationFrame(draw)};
 requestAnimationFrame(draw);
 cv.onmousemove=e=>{hx=e.offsetX;draw(t0+2000)};cv.onmouseleave=()=>{hx=-1;draw(t0+2000)};
}
const N={'1h':60,'6h':90,'24h':120,'7d':140};
function metric(id,title,sub,series,cols,names,fmt,extra=''){
 return`${head(title,sub)}<div class="rng rv">${Object.keys(N).map(k=>`<button class="${k=='1h'?'on':''}" data-r="${k}">${k=='1h'?'1 час':k=='6h'?'6 часов':k=='24h'?'24 часа':'7 дней'}</button>`).join('')}</div><div class="card rv"><canvas id="${id}"></canvas></div>${extra}`}
function bindRange(id,gen,cols,names,fmt){const go=k=>chart($('#'+id),gen(N[k]),cols,names,fmt);go('1h');
 $$('.rng button').forEach(b=>b.onclick=()=>{$$('.rng button').forEach(x=>x.classList.remove('on'));b.classList.add('on');go(b.dataset.r)})}
const kb=v=>v>1024?(v/1024).toFixed(1)+' МБ/с':v.toFixed(0)+' КБ/с';

const procs=[['1284','dockerd',18.4,412],['3921','postgres',12.1,880],['2210','node',9.7,356],['771','nginx',4.2,64],['5502','redis-server',3.1,128],['1','systemd',.4,22]];
const disks=[['/dev/nvme0n1p2','/','ext4',238,141],['/dev/sda1','/data','xfs',1800,1710],['/dev/sdb1','/home','btrfs',900,330],['/dev/nvme0n1p1','/boot/efi','vfat',1,.2]];
const PG={
'/':()=>`<section class="hero"><h1>${split('Сервер жив')}</h1><svg class="ecg" viewBox="0 0 800 110" preserveAspectRatio="none"><path d="M0 60H180L200 60L215 15L235 100L255 40L270 60H520L540 60L555 15L575 100L595 40L610 60H800"/></svg></section>
<div class="card rv" style="display:flex;gap:30px;flex-wrap:wrap;margin-bottom:16px;padding:16px 22px">${[['Хост','srv-prod-01'],['ОС','Ubuntu 24.04'],['Аптайм','27 д 4 ч'],['Load average','0,84 · 0,71 · 0,66'],['Ядер','8'],['IP','192.168.1.20']].map(([a,b])=>`<div><div class="lb">${a}</div><b>${b}</b></div>`).join('')}</div>
<div class="grid">${cap('Процессор','cpu',37,'%')}${cap('Оперативная память','ram',62,'%')}${cap('Входящая скорость RX','rx',48,'МБ/с',9)}${cap('Исходящая скорость TX','tx',21,'МБ/с',5)}</div>

<div class="card rv"><h2>Файловые системы</h2><div class="sc"><table><thead><tr><th>Устройство</th><th>Точка</th><th>Тип</th><th>Размер</th></tr></thead><tbody>${disks.map(d=>`<tr><td>${d[0]}</td><td>${d[1]}</td><td>${d[2]}</td><td>${d[3]} ГБ</td></tr>`).join('')}</tbody></table></div></div>`,

};

/* Docker */
const C=[['api-gateway','nginx:1.27','run','shop',[8080],14,22,'4h 12m',0],['shop-web','node:22','run','shop',[3000],31,48,'2d 3h',0],['shop-db','postgres:16','run','shop',[5432],22,71,'9d 1h',0],['grafana','grafana:11','run','obs',[3001],5,19,'6d 8h',0],['prometheus','prom:v2.54','warn','obs',[9090],9,34,'12s',3],['loki','loki:3.1','bad','obs',[3100],0,0,'—',7],['redis','redis:7','run','core',[6379],3,8,'11d 4h',0],['minio','minio:latest','off','core',[9000],0,0,'—',1],['worker','app/worker','bad','core',[],88,93,'2m',12]];
const D={f:'all',q:'',g:true,s:'cpu',sel:null,open:{},t:'g'};
const stc=s=>s=='run'?'Работает':s=='bad'?'Проблема':s=='warn'?'Перезапуск':'Остановлен';
const row=c=>`<tr data-n="${c[0]}" style="cursor:pointer"><td><i class="dot ${c[2]}"></i>${c[0]}</td><td class="lb">${c[1]}</td><td><span class="mini"><b style="width:${c[5]}%"></b></span>${c[5]}%</td><td><span class="mini"><b style="width:${c[6]}%"></b></span>${c[6]}%</td><td>${c[8]}</td><td>${c[7]}</td><td><button class="btn o" data-rs="${c[0]}">Перезапустить</button></td></tr>`;
const tbl=l=>`<div class="sc"><table><thead><tr>${[['n','Имя'],['i','Образ'],['cpu','CPU'],['mem','Память'],['rs','Рестарты'],['up','Аптайм'],['',' ']].map(h=>`<th data-s="${h[0]}">${h[1]}</th>`).join('')}</tr></thead><tbody>${l.map(row).join('')}</tbody></table></div>`;
function dk(){
 const f={all:()=>1,run:c=>c[2]=='run',bad:c=>c[2]=='bad'||c[2]=='warn',off:c=>c[2]=='off'},q=D.q.toLowerCase();
 let l=C.filter(c=>f[D.f](c)&&(c.join(' ')).toLowerCase().includes(q));
 const k={n:c=>c[0],cpu:c=>-c[5],mem:c=>-c[6],rs:c=>-c[8],up:c=>c[7]};
 l.sort((a,b)=>{const x=(k[D.s]||k.cpu)(a),y=(k[D.s]||k.cpu)(b);return x>y?1:x<y?-1:0});
 const cnt=x=>C.filter(f[x]).length;
 $('#fl').innerHTML=[['all','Все'],['run','Работают'],['bad','Проблемы'],['off','Остановлены']].map(([a,b])=>`<button class="chip ${D.f==a?'on':''}" data-f="${a}">${b} (${cnt(a)})</button>`).join('');
 $('#gt').textContent=D.g?'По проектам':'Плоский список';
 let h;
 if(D.g){const P=[...new Set(l.map(c=>c[3]))];h=P.map(p=>{const g=l.filter(c=>c[3]==p);return`<div class="acc ${D.open[p]?'c':''}"><div class="hd" data-p="${p}"><b>${p}</b><span class="badge">${g.length} конт.</span><span class="lb" style="margin-left:auto">CPU ${g.reduce((s,c)=>s+c[5],0)}% · RAM ${Math.round(g.reduce((s,c)=>s+c[6],0)/g.length)}%</span></div><div class="bd"><div class="card" style="padding:6px 12px;margin-top:8px">${tbl(g)}</div></div></div>`}).join('')}
 else h=`<div class="card">${tbl(l)}</div>`;
 $('#dl').innerHTML=h||'<p class="lb">Ничего не найдено. Измените запрос или фильтр.</p>';
 const bad=C.filter(c=>c[2]=='bad');
 $('#tl').innerHTML=C.map(c=>`<div class="tile ${c[2]}" data-n="${c[0]}" title="${c[0]} · ${stc(c[2])}">${c[0].slice(0,3)}</div>`).join('');$('#al').innerHTML=bad.length?`<div class="alert"><span>Проблемы: ${bad.map(c=>c[0]).join(', ')}</span><button class="btn" data-f="bad">Показать</button></div>`:'';
 $('#top').innerHTML=[['Топ по CPU',5],['Топ по памяти',6]].map(([t,i])=>{const c=[...C].sort((a,b)=>b[i]-a[i])[0];return`<div class="card" style="--a:${i==5?'#d04058':'#d9962a'}"><div class="lb">${t}</div><div class="k" style="font-size:1.3rem">${c[0]}</div><div class="bar"><b data-w="${c[i]}"></b></div></div>`}).join('');
 bars();
}
function dkBind(){
 $('#q').oninput=e=>{D.q=e.target.value;dk()};
 $('#gt').onclick=()=>{D.g=!D.g;dk()};
 $('#m').onclick=e=>{const t=e.target.closest('[data-f],[data-s],[data-p].hd,[data-rs],[data-n]');if(!t||!$('#dl'))return;
  if(t.dataset.f){D.f=t.dataset.f;dk()}else if(t.dataset.s!==undefined&&t.tagName=='TH'){D.s=t.dataset.s;dk()}
  else if(t.classList.contains('hd')){D.open[t.dataset.p]=!D.open[t.dataset.p];dk()}
  else if(t.dataset.rs){e.stopPropagation();confirmRs(t.dataset.rs)}
  else if(t.dataset.n)inspect(t.dataset.n)};
}
function inspect(n,tab='g'){const c=C.find(x=>x[0]==n);D.sel=n;D.t=tab;
 const tabs=[['g','Графики'],['l','Логи'],['c','Конфигурация'],['i','Инциденты']];
 let b='';
 if(tab=='g')b=['CPU','Память','Сеть RX/TX'].map((t,i)=>`<h2>${t}</h2><canvas id="ic${i}" style="height:130px"></canvas>`).join('');
 if(tab=='l')b=`<div class="tb"><span class="lb">Строк:</span>${[50,150,300,1000].map(x=>`<button class="chip ${x==150?'on':''}">${x}</button>`).join('')}<button class="chip on" id="as">Автоскролл</button></div><div class="term" id="tm"></div><div class="tb" style="margin-top:10px"><button class="btn o" id="cp">Копировать</button><button class="btn o" id="dw">Скачать ${n}-logs.txt</button></div>`;
 if(tab=='c')b=`<h2>Порты</h2><p style="margin-bottom:14px">${c[4].length?c[4].map(p=>`<a class="badge" style="text-decoration:none" href="http://localhost:${p}" target="_blank">localhost:${p}</a> `).join(''):'<span class="lb">Порты не опубликованы</span>'}</p><h2>Быстрые команды</h2>${['docker logs -f ','docker restart ','docker exec -it '].map((x,i)=>`<pre>${x}${n}${i==2?' sh':''}<button class="btn o" style="padding:2px 10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.parentNode.firstChild.textContent)">Копировать</button></pre>`).join('')}<h2 style="margin-top:20px">Метаданные</h2><p class="lb">Образ: ${c[1]}<br>Статус: ${stc(c[2])}<br>Политика перезапуска: unless-stopped<br>Проект: ${c[3]}</p>`;
 if(tab=='i')b=c[8]?[...Array(Math.min(c[8],5))].map((_,i)=>`<div class="card" style="margin-bottom:10px;padding:14px"><i class="dot bad"></i>${['Аварийное завершение (код 137)','Healthcheck не пройден','Перезапуск','OOM kill','Остановка'][i%5]}<div class="lb">${i+1} ч назад</div></div>`).join(''):'<p class="lb">Инцидентов не было.</p>';
 $('#ins').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><i class="dot ${c[2]}"></i><b style="font:700 18px Unbounded">${n}</b></div><div><button class="btn" data-rs="${n}" id="irs">Перезапустить</button> <button class="btn o" id="x">Закрыть</button></div></div><div class="tabs">${tabs.map(([k,l])=>`<button class="chip ${k==tab?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>${b}`;
 $('#ins').classList.add('o');
 $$('#ins [data-t]').forEach(x=>x.onclick=()=>inspect(n,x.dataset.t));
 $('#x').onclick=()=>$('#ins').classList.remove('o');
 $('#irs').onclick=()=>confirmRs(n);
 if(tab=='g'){chart($('#ic0'),[walk(60,c[5]+5,10),walk(60,c[5],5)],['#ff5a70','#ff1f3d'],['пик','сред']);chart($('#ic1'),[walk(60,c[6]+4,6),walk(60,c[6],3)],['#ffb020','#ff1f3d'],['пик','сред']);chart($('#ic2'),[walk(60,40,15),walk(60,20,10)],['#4dc3ff','#ff9a3d'],['RX','TX'],v=>v.toFixed(0)+' КБ/с')}
 if(tab=='l'){const tm=$('#tm');const add=()=>{if(!$('#tm'))return clearInterval(D.lt);const e=Math.random()<.12,d=document.createElement('div');d.className=e?'e':'';d.textContent=`${new Date().toISOString().slice(11,19)} ${e?'ERROR timeout upstream':'INFO request handled '+(R(2,90)|0)+'ms'}`;tm.append(d);if($('#as').classList.contains('on'))tm.scrollTop=1e6};
  for(let i=0;i<14;i++)add();clearInterval(D.lt);D.lt=setInterval(add,4000);$('#as').onclick=e=>e.target.classList.toggle('on');
  $('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(tm.innerText);toast('Логи скопированы')};$('#dw').onclick=()=>toast('Файл '+n+'-logs.txt подготовлен')}
}
function confirmRs(n){const m=$('#md');m.innerHTML=`<div><h2 style="color:var(--t);font-size:16px">Перезапустить ${n}?</h2><p class="lb" style="margin-bottom:20px">Контейнер будет недоступен несколько секунд.</p><button class="btn" id="ok">Перезапустить</button> <button class="btn o" id="no">Отмена</button></div>`;m.classList.add('o');
 $('#no').onclick=()=>m.classList.remove('o');
 $('#ok').onclick=()=>{m.classList.remove('o');const bs=$$(`[data-rs="${n}"]`);bs.forEach(b=>{b.disabled=true;b.innerHTML='<i class="sp"></i>Перезапуск'});
  setTimeout(()=>{const c=C.find(x=>x[0]==n);c[2]='run';c[8]=0;toast('Контейнер '+n+' перезапущен');if($('#dl'))dk();if(D.sel==n&&$('#ins.o'))inspect(n,D.t)},1800)}}
function toast(t,e){const d=document.createElement('div');d.className='toast'+(e?' e':'');d.textContent=t;$('#ts').append(d);setTimeout(()=>d.remove(),3500)}

function feed(){const E=[['run','api-gateway обработал 1 240 запросов'],['bad','worker: нехватка памяти, контейнер перезапущен'],['warn','prometheus перезапущен'],['run','Резервная копия /data завершена'],['warn','Диск /data заполнен на 95%'],['run','shop-db: healthcheck пройден']];
 const add=()=>{const f=$('#fd');if(!f)return;const e=E[Math.random()*E.length|0],d=document.createElement('div');d.innerHTML=`<time>${new Date().toTimeString().slice(0,8)}</time><span><i class="dot ${e[0]}"></i>${e[1]}</span>`;f.prepend(d);while(f.children.length>6)f.lastChild.remove()};
 for(let i=0;i<4;i++)add();clearInterval(D.ft);D.ft=setInterval(add,3500)}
/* Common */
function bars(){requestAnimationFrame(()=>{$$('.bar b[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');$$('[data-o]').forEach(c=>c.style.strokeDashoffset=c.dataset.o)})}
function count(el){const to=+el.dataset.b,t0=performance.now(),f=n=>{const p=Math.min(1,(n-t0)/1300);el.textContent=(to*(1-Math.pow(1-p,4))).toFixed(to<10?1:0);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function tick(){$$('[data-live]').forEach(el=>{const b=+el.dataset.b,v=Math.max(1,Math.min(99,b+R(-1,1)*+el.dataset.a));el.dataset.b=v;el.textContent=v.toFixed(v<10?1:0);const bar=el.closest('.card').querySelector('.bar b');if(bar)bar.style.width=v+'%'})}
function resetTimer(){clearInterval(timer);timer=setInterval(tick,IV)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function route(){const p=location.hash.slice(1)||'/',m=$('#m');clearInterval(D.lt);clearInterval(D.ft);$('#ins').classList.remove('o');
 m.innerHTML=(PG[p]||PG['/'])();fold();$$('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==p));window.scrollTo(0,0);
 $$('.rv').forEach((e,i)=>{if(!e.style.getPropertyValue('--i'))e.style.setProperty('--i',i%6);io.observe(e)});
 $$('[data-live]').forEach(count);bars();
 if(p=='/'){feed();chart($('#c1'),[walk(60,37,14)],['#d04058'],['CPU']);chart($('#c2'),[walk(60,62,6)],['#d9962a'],['RAM'])}
 if(p=='/cpu')bindRange('cc',n=>[walk(n,38,16)],['#d04058'],['CPU']);
 if(p=='/memory')bindRange('cm',n=>[walk(n,62,5),walk(n,12,2)],['#d9962a','#8b6fd6'],['RAM','Swap']);
 if(p=='/network')bindRange('cn',n=>[walk(n,900,500,3000),walk(n,350,250,3000)],['#4dc3ff','#ff9a3d'],['RX','TX'],kb);
 if(p=='/docker'){dk();dkBind()}
 if(p=='/settings')$$('.rng button').forEach(b=>b.onclick=()=>{$$('.rng button').forEach(x=>x.classList.remove('on'));b.classList.add('on');IV=+b.dataset.v;LS('iv',IV);resetTimer();toast('Обновление: '+b.textContent.toLowerCase())});
}
addEventListener('hashchange',route);
addEventListener('scroll',()=>{$('#bar').style.width=scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100+'%'},{passive:true});
addEventListener('pointermove',e=>{document.body.style.setProperty('--mx',e.clientX+'px');document.body.style.setProperty('--my',e.clientY+'px');const c=e.target.closest&&e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--cx',e.clientX-r.left+'px');c.style.setProperty('--cy',e.clientY-r.top+'px')}});
resetTimer();route();window.__r=1;
</script></body></html>
